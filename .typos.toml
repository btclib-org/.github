# typos' configuration, in a file of its own because there is no
# pyproject.toml here to hold it: this repository is prose, and the
# tables below are the same two the other repositories carry inside
# [tool.typos].
#
# What is *not* here matters as much: no `files.extend-exclude`. A file
# the checker never reads is a file nobody is checking, and the point of
# naming a word is that the next one still gets reported.
[default.extend-words]
# ruff's flake8-copyright prefix, which the standard names where it says
# the copyright notice is a ruff rule rather than a hook. typos reads it
# as "COPY" or "CPU" misspelled, both of which it would be anywhere else
CPY = "CPY"
