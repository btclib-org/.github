# The one thing this repository could not check about itself in prose:
# whether the other repositories still agree with README.md. Section 15
# gives the commands a human runs to audit one repository; this is the
# subset a machine can run against all of them, weekly, unattended.
#
# It is not a distribution. Section 3 describes the `pyproject.toml` of a
# package that ships -- name, version, classifiers, keywords, urls, a
# build backend, a wheel -- and none of that applies to a tree whose only
# Python is a test suite. `package = false` below is what says so to uv,
# and what keeps `uv run` from trying to build this directory before
# running anything in it.

[project]
name = "btclib-alignment"
version = "0"
# This is not a library covering every interpreter still in support: it
# is one suite, run by one workflow, on one runner. So the rule for an
# application applies -- the newest its dependencies allow -- and which
# interpreter that is, `.python-version` says rather than this comment.
requires-python = ">=3.14"

[dependency-groups]
# `gh` and `git` are the other two dependencies and neither is a wheel:
# both are on every GitHub-hosted runner already, and CONTRIBUTING.md
# says so for a developer running this by hand.
test = [
    "pytest",
    # a workflow file is read with a parser and not with a regex: what
    # this suite asks of one is where its `cron:` entries are, which is
    # a question about the document's shape rather than about a line
    "pyyaml",
    # the offline copy of PyPI's classifier list, which is what makes
    # "is this a real classifier" answerable before an upload rather
    # than during one. Section 3 has the argument
    "trove-classifiers",
]
lint = ["mypy", "pre-commit", "types-PyYAML"]

[tool.uv]
# nothing is built here, so nothing installs this directory either
package = false
# the oldest uv that may read uv.lock -- section 1 has the argument and
# section 15 the command that measures the ceiling
required-version = ">=0.12.1"

[tool.ruff]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# preview and explicit-preview-rules only make sense as a pair, and this
# file needs the first because naming a rule in `ignore` below, instead
# of coding it, is itself a preview feature. Alone it would also turn on
# every rule ruff is still designing; the second takes that back off, so
# a preview rule runs only where this file names it exactly.
preview = true
explicit-preview-rules = true
# The tree is a test suite and nothing else, so the select list is the
# organization's minus what only a library has to answer for: no D on
# top of the defaults beyond what a test module needs. What is here is
# what finds something in test code -- a bare except, a mutable default,
# an undocumented module, a path built with os.path. CPY is in: section
# 5's rule is about every source file and says nothing about a package,
# and this tree's Python is source whoever imports it, which nobody does.
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "CPY", # flake8-copyright
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "ERA", # eradicate
    "F",   # pyflakes
    "FA",  # flake8-future-annotations
    "FIX", # flake8-fixme
    "I",   # isort
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    # __init__ is documented by its class, and a magic method by the data
    # model it implements: section 5's two exemptions, which pep257
    # itself does not ask for
    "undocumented-magic-method",
    "undocumented-public-init",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert, which is how a test states what it checks
    # this suite exists to run `git` and `gh`, so a subprocess call with a
    # partial path is what every helper here is. The argument lists are
    # built from the organization name and a repository name the API
    # answered with -- never from a test's input -- and `shell=False` is
    # the default the helpers keep
    "S603",
    "S607",
]

[tool.ruff.lint.mccabe]
# ruff's default, as everywhere in the organization
max-complexity = 10

[tool.ruff.lint.pycodestyle]
# section 5's second width, and the one the formatter cannot reach:
# ruff-format reflows code to 88 columns and rewrites neither a comment
# nor a docstring, so this is the other half of a file, held to the
# width MD013 already holds the markdown here to. W505 is in the "W"
# family selected above and is inert without this key, ruff having no
# default doc length
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
# section 5's convention, which decides which of the "D" family above
# runs. At pep257 the family is what that document asks for; unset, it
# is every rule ruff writes under D, `missing-terminal-punctuation`
# among them -- a second rule over the end of a summary line, reporting
# the docstring `missing-trailing-period` has already reported. It is
# also what settles the pairs ruff calls incompatible, so no entry above
# names the half it disables
convention = "pep257"

[tool.ruff.lint.flake8-copyright]
# COPYRIGHT transcribed, the way section 5 spells the transcription:
# each line with its regex metacharacters escaped, the lines joined by a
# literal \n, the whole anchored with ^ so that the notice opens the
# file rather than sitting anywhere in its first 4096 bytes. ruff reads
# this string and never the file, so tests/copyright_test.py is what
# compares the two, here as in every tree that declares one; its
# `transcribed` is what wrote this value, byte for byte the one the
# sibling repositories declare
notice-rgx = "^# Copyright \\(c\\) The btclib developers\\n# Distributed under the MIT software license, see the accompanying\\n# LICENSE file or https://opensource\\.org/license/mit for the full text\\."

# typos' configuration, where section 4 says both spell checkers are
# configured and where every sibling keeps this one. What is *not* here
# matters as much: no `files.extend-exclude`. A file the checker never
# reads is a file nobody is checking, and the point of naming a word is
# that the next one still gets reported.
[tool.typos.default.extend-words]
# ruff's flake8-copyright prefix, which the standard names where it says
# the copyright notice is a ruff rule rather than a hook. typos reads it
# as "COPY" or "CPU" misspelled, both of which it would be anywhere else
CPY = "CPY"

[tool.mypy]
strict = true
show_column_numbers = true
# section 6's list, the same in every tree of the organization
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
warn_unreachable = true
# what requires-python says, for the reason a sibling's own comment
# gives at this key: without it mypy targets whatever runs it
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the organization's strictness flags, minus the ones that answer a
# question this suite does not have. No --cov: coverage at 100% is a
# claim about a package's own code, and this tree ships none -- what
# would be measured is the suite measuring itself. No -n auto either:
# every test here waits on the network, so the wall clock is the fetch
# and not the CPU, and the fetching is done once in a session fixture
# -p pytester: tests/backlog_test.py runs a suite of its own in a
# temporary directory to ask what conftest.py does with a backlog row on
# a cell the run skips, and pytester is the fixture that runs one
addopts = "-ra --durations=8 --strict-config --strict-markers -p pytester"
xfail_strict = true
# --strict-markers is on, so a marker is declared here or it is a typo.
# Every test that reaches GitHub carries `integration`: section 7's rule
# that a test never reaches the network is what makes this suite an
# exception that has to announce itself, and BTCLIB_INTEGRATION is the
# same switch the siblings' own integration suites read
markers = [
    "integration: reaches GitHub, opt-in via BTCLIB_INTEGRATION",
    # section 2's tier a per-repository test applies down to, read off
    # each tree by tests/__init__.py as that section measures it
    "tier(asked): skip a repository this tier does not bind, with the reason",
    # the issues a row of the backlog in tests/__init__.py carries, put
    # on the cell beside the expected failure so conftest.py can tell a
    # skip on an excused cell from any other skip
    "backlog(*issues): the cell is a row of the backlog, excused by these issues",
]
filterwarnings = ["error"]
