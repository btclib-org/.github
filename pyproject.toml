# The one thing this repository could not check about itself in prose:
# whether the other repositories still agree with README.md. Section 15
# gives the commands a human runs to audit one repository; this is the
# subset a machine can run against all of them, weekly, unattended.
#
# It is not a distribution. Section 3's metadata that only an index reads
# is therefore not here -- no classifiers, no urls, no license
# expression, no build backend and no wheel -- there being no upload for
# any of them to describe. `package = false` below is what says so to uv,
# and what keeps `uv run` from trying to build this directory before
# running anything in it.
#
# What section 3 binds to the `[project]` table rather than to an index
# is here all the same, `authors` and `keywords` both, each with the
# reason at the key.

[project]
name = "btclib-alignment"
version = "0"
# Section 3 binds this key to every tree that declares a [project]
# table, so a tree that builds nothing declares it too: the collective
# the MIT notice names, never a literal of this tree's own. No index
# ever serves it from here -- what it buys is that the answer for a
# tree of this shape is read off the standard rather than derived again
authors = [{ name = "The btclib developers", email = "devs@btclib.org" }]
# This is not a library covering every interpreter still in support: it
# is one suite, run by one workflow, on one runner. So the rule for an
# application applies -- the newest its dependencies allow -- and which
# interpreter that is, `.python-version` says rather than this comment.
requires-python = ">=3.14"
# the GitHub topics, the same names in the same lowercase spelling.
# Section 3 turns this key on the [project] table and not on the index,
# so a tree that uploads nothing writes the list all the same: the
# topics are how a reader of github.com/btclib-org finds the standard
# the other repositories are kept to, and this is what they are read
# against. The order is this file's alone -- `gh api
# repos/btclib-org/.github --jq '.topics'` sorts what it is given -- and
# it runs from what the tree is to what it is about. Each name is read
# against the tree rather than taken from a sibling's list
keywords = [
    "repository-standard",
    "github-organization",
    "btclib",
    "bitcoin",
]

[dependency-groups]
# `gh` and `git` are the other two dependencies and neither is a wheel:
# both are on every GitHub-hosted runner already, and CONTRIBUTING.md
# says so for a developer running this by hand.
test = [
    "pytest",
    # section 7's default, taken rather than declined: tests/README.md
    # says what the shuffle guards in this suite and what argued against
    # it, and `-p no:randomly` is how a failure is reproduced in order
    "pytest-randomly",
    # section 7's per-test bound, which is what names a wedged test
    # where `alignment.yml`'s `timeout-minutes` names only a wedged
    # runner. The limit is in [tool.pytest.ini_options] below
    "pytest-timeout",
    # a workflow file is read with a parser and not with a regex: what
    # this suite asks of one is where its `cron:` entries are, which is
    # a question about the document's shape rather than about a line
    "pyyaml",
    # the offline copy of PyPI's classifier list, which is what makes
    # "is this a real classifier" answerable before an upload rather
    # than during one. Section 3 has the argument
    "trove-classifiers",
]
lint = ["mypy", "pre-commit", "types-PyYAML"]
# section 1's `dev` row: every group this file declares, so that one
# sync installs what any command here runs. uv makes it the default of
# `uv sync` and `uv run`, `[tool.uv]` below naming no `default-groups`;
# CLAUDE.md says what a bare `uv run pytest` then measures
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.uv]
# nothing is built here, so nothing installs this directory either
package = false
# the oldest uv that may read uv.lock -- section 1 has the argument and
# section 15 the command that measures the ceiling
required-version = ">=0.12.7"

[tool.ruff]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# preview and explicit-preview-rules only make sense as a pair, and this
# file needs the first because naming a rule in `ignore` below, instead
# of coding it, is itself a preview feature. Alone it would also turn on
# every rule ruff is still designing; the second takes that back off, so
# a preview rule runs only where this file names it exactly.
preview = true
explicit-preview-rules = true
# Every family ruff ships, present ones and a release's future ones
# alike: a hand-picked list is what this key held until this file's
# repository-specific measurement, and a list is a thing that rots --
# nothing forces a second edit here the day ruff adds a family nobody
# has looked at yet. "ALL" takes a new family in on the pull request
# that bumps ruff's pinned rev instead, which is the day someone is
# already looking at what changed. Section 5 has the rule this states;
# this file is the tree it decided for.
select = ["ALL"]
ignore = [
    # ruff's own docs/formatter.md, under "Conflicting lint rules":
    # each of these is undone by the formatter's own rewriting, so
    # selecting it is a lint failure the next `ruff format` produces
    # again. The list is the vendor's, and does not change with this
    # tree. D203 needs no entry here: the pep257 convention below
    # already disables it in favour of D211 -- the other half of the
    # pair ruff calls incompatible -- without printing the warning
    # ruff reserves for a pair nothing has settled.
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "unnecessary-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    # a magic method is documented by the data model it implements, so a
    # docstring on it only restates that model: section 5 gives the
    # reason
    "undocumented-magic-method",
    # the rule checks that __init__ carries a docstring, never that the
    # docstring says anything a type-checked signature does not already
    # show: section 5 gives the reason
    "undocumented-public-init",
    # flake8-todos disciplines the format of a marker FIX above already
    # refuses outright -- TD001 through TD007 are the whole family, and
    # each is a question about a TODO/FIXME/XXX/HACK comment that a tree
    # FIX holds clean cannot contain. TD001 also steers a refused marker
    # toward TODO, which FIX002 refuses just as hard, and TD is not even
    # a superset: HACK draws no TD diagnostic at all. Section 5 gives the
    # reason this tree keeps the refusal over the formatting.
    "invalid-todo-tag",
    "missing-todo-author",
    "missing-todo-link",
    "missing-todo-colon",
    "missing-todo-description",
    "invalid-todo-capitalization",
    "missing-space-after-todo-colon",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert, which is how a test states what it checks
    # this suite exists to run `git` and `gh`, so a subprocess call with a
    # partial path is what every helper here is. The argument lists are
    # built from the organization name and a repository name the API
    # answered with -- never from a test's input -- and `shell=False` is
    # the default the helpers keep
    "S603",
    "S607",
]

[tool.ruff.lint.mccabe]
# ruff's default, as everywhere in the organization
max-complexity = 10

[tool.ruff.lint.pycodestyle]
# section 5's second width, held to the width MD013 already holds the
# markdown here to: max-doc-length reaches a docstring and a
# whole-line comment -- prose ruff-format never reflows -- and stops
# there, a comment ending in a URL excepted, so a comment following
# code on its line is outside the key. This tree does not ignore
# line-too-long, so such a comment is unmeasured between 81 and 88
# columns and reported above 88 by that rule instead -- except where a
# URL or a pragma that rule recognises is what carries the line past
# 88, which it passes over. The exemption is that condition and not the
# shape: code already over 88 before the comment starts is reported
# whatever follows it. `# pragma: no cover` is not one of the pragmas
# it recognises, so section 8's inline half is measured here like any
# other trailing comment. W505 is in the "W" family selected above and
# is inert without this key, ruff having no default doc length
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
# section 5's convention, which decides which of the "D" family above
# runs. At pep257 the family is what that document asks for; unset, it
# is every rule ruff writes under D, `missing-terminal-punctuation`
# among them -- a second rule over the end of a summary line, reporting
# the docstring `missing-trailing-period` has already reported. It is
# also what settles the pairs ruff calls incompatible, so no entry above
# names the half it disables
convention = "pep257"

[tool.ruff.lint.flake8-copyright]
# COPYRIGHT transcribed, the way section 5 spells the transcription:
# each line with its regex metacharacters escaped, the lines joined by a
# literal \n, the whole anchored with ^ so that the notice opens the
# file rather than sitting anywhere in its first 4096 bytes. ruff reads
# this string and never the file, so tests/copyright_test.py is what
# compares the two, here as in every tree that declares one; its
# `transcribed` is what wrote this value, byte for byte the one the
# sibling repositories declare
notice-rgx = "^# Copyright \\(c\\) The btclib developers\\n# Distributed under the MIT software license, see the accompanying\\n# LICENSE file or https://opensource\\.org/license/mit for the full text\\."

# typos' configuration, where section 4 says both spell checkers are
# configured and where every sibling keeps this one. What is *not* here
# matters as much: no `files.extend-exclude`. A file the checker never
# reads is a file nobody is checking, and the point of naming a word is
# that the next one still gets reported.
[tool.typos.default.extend-words]
# ruff's flake8-copyright prefix, which the standard names where it says
# the copyright notice is a ruff rule rather than a hook. typos reads it
# as "COPY" or "CPU" misspelled, both of which it would be anywhere else
CPY = "CPY"

[tool.mypy]
strict = true
show_column_numbers = true
# section 6's list, the same in every tree of the organization
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
warn_unreachable = true
# what requires-python says, for the reason a sibling's own comment
# gives at this key: without it mypy targets whatever runs it
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the organization's strictness flags, minus the ones that answer a
# question this suite does not have. No --cov: coverage at 100% is a
# claim about a package's own code, and this tree ships none -- what
# would be measured is the suite measuring itself. No -n auto either:
# what a test asking about another repository waits on is the fetching,
# so the wall clock is that and not the CPU, and the longest waits are
# the session fixtures', taken once for the run
# -p pytester: tests/backlog_test.py runs a suite of its own in a
# temporary directory to ask what conftest.py does with a backlog row on
# a cell the run skips, and pytester is the fixture that runs one
addopts = "-ra --durations=8 --strict-config --strict-markers -p pytester"
xfail_strict = true
# Section 7's per-test bound, for a suite that waits on something
# outside its own process. Without it a hang is the one failure this
# suite cannot report: the run stops rather than fails, and what a
# reader gets is `alignment.yml` cancelled at its `timeout-minutes`,
# naming the job and no test. pytest-timeout's `signal` method, which
# it picks wherever SIGALRM exists and so on the runner, raises inside
# the item and fails it, leaving the rest of the matrix to be asked.
# `timeout_method` is unset for that reason: the other method ends the
# process with `os._exit`, which loses the report this line is for.
#
# One item's whole protocol is bounded rather than its body alone.
# `timeout_func_only` would time the bodies, and the waiting here is
# mostly the session fixtures' -- a clone of every repository, a
# repository document for each -- which pytest-timeout charges to
# whichever item triggered them; timing bodies alone leaves a stalled
# clone unbounded, and that is the hang there is to catch.
# `session_timeout` is read between items and cannot interrupt one.
#
# So the number is the worst item a shuffle can build -- every session
# fixture set up for one test, plus the slowest body -- rather than the
# worst seen, `pytest-randomly` putting a different test in that place
# each run. Measured on a ten-core machine sharing its cores with other
# work, its load average reaching 14, over whole runs of
#
#   BTCLIB_INTEGRATION=1 uv run --locked --no-default-groups \
#     --group test pytest --durations=0 --durations-min=0
#
# the setup phases summed to 75.28s beside a slowest body of 5.65s,
# and on the run where the API began refusing, to 114.60s beside
# 6.20s. This doubles the second of those, and sits far enough under
# `alignment.yml`'s fifteen minutes that a run losing an item to it
# still finishes and reports the rest, the slowest whole run here
# taking 155.97s. Nothing measured on the runner stands behind it,
# btclib-org/.github#628 being what has to close for there to be one
timeout = 240
# --strict-markers is on, so a marker is declared here or it is a typo.
# Every test that reaches GitHub carries `integration`: section 7's rule
# that a test never reaches the network is what makes this suite an
# exception that has to announce itself, and BTCLIB_INTEGRATION is the
# same switch the siblings' own integration suites read
markers = [
    "integration: reaches GitHub, opt-in via BTCLIB_INTEGRATION",
    # section 2's tier a per-repository test applies down to, read off
    # each tree by tests/__init__.py as that section measures it
    "tier(asked): skip a repository this tier does not bind, with the reason",
    # the issues a row of the backlog in tests/__init__.py carries, put
    # on the cell beside the expected failure so conftest.py can tell a
    # skip on an excused cell from any other skip
    "backlog(*issues): the cell is a row of the backlog, excused by these issues",
]
filterwarnings = ["error"]
