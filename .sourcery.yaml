---
# Sourcery's configuration, which reusable-sourcery.yml's job reads.
# Section 10's *The set, and its cadence* says what it holds. The rules
# turned off are TURNED_OFF's in tests/hooks_test.py, each beside the
# rule of the gate it conflicts with.
version: "1"

rule_settings:
  # TURNED_OFF's rules, none at present
  disable: []
  # The lowest interpreter this tree's code runs on: pyproject.toml's
  # per-file-target-version holds the scripts it names at py311.
  python_version: "3.11"
