---
name: Bug report
description: Something does not do what its documentation says
labels: [bug]

body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: >
        The shortest thing somebody else can run, from a state they can
        reach, and the whole of what it prints where there is a traceback
        or an error.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: >
        The release, where the repository cuts one; otherwise the commit,
        `git rev-parse --short HEAD`.
      placeholder: "2026.8, or 83e339a"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: >
        The operating system and architecture, and the interpreter or
        toolchain version, where the report is about something that runs.
      placeholder: "macOS 15.6 arm64, CPython 3.13.5"

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >
        The documentation, specification or test vector the behaviour
        disagrees with, and the version this last worked on.
