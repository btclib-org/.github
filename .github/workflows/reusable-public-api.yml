---
name: reusable-public-api

# The griffe walk a repository's release.yml runs before publishing, so
# the previous-tag resolution, the comparison and the failure message
# are written once. The trigger stays in the caller, whose run this job
# joins; it runs here rather than as a merge gate on the reasoning
# btclib-org/.github#326 already settled -- before 1.0 the public
# surface breaks deliberately and often, and a gate reporting every such
# break on every pull request has nothing to say about which ones are
# allowed, where a release-time run arrives once, while RELEASE_NOTES.md
# is being written.
#
# One input, the package griffe walks. No default: the package is the
# calling repository's name only by a convention, and a default would be
# right where the convention holds and wrong in silence where it does not.
#
# A finding is refused only where the release's own section of
# RELEASE_NOTES.md does not name its object, so the job is red on a
# break nobody wrote down and green on one the notes list. The section
# is the tag's on a release and, on a rehearsal, the one for the version
# in pyproject.toml, else the first under the file's title; the script
# says how a name is read.
#
# -s . -s src is not an input: every tree with a release.yml has moved
# its package from the repository root to src/ at some point in its own
# tag history, and a search path that finds nothing in one of the two
# is skipped in favour of the other, so one line serves every caller on
# either side of its own move without needing to know which side a
# given tag is on.

on:
  workflow_call:
    inputs:
      package:
        description: the griffe target, e.g. "btclib" or "btclib_node"
        required: true
        type: string

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, griffe itself) can read the token, so the
# workflow default must not be able to write to the repository. No job
# elevates it, this job reading the tree and two tags and writing
# nothing back
permissions:
  contents: read

jobs:
  public-api:
    # the name the check context is keyed by, after the calling job's
    # own: branch protection matches a context by name and not by the
    # workflow that reported it
    name: Check the public API against the last release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the previous tag has to be reachable in this checkout for
          # the step below to find it, and the default single-commit
          # checkout would not carry it
          fetch-depth: 0
          fetch-tags: true
      # a release tag is already on the remote by the time this job
      # runs, so the "latest tag" griffe would resolve on its own is the
      # release being cut, not the one before it -- comparing a tag
      # against itself reports no break whatever changed. The previous
      # tag is resolved explicitly instead, by walking the ref's own
      # ancestry rather than a version sort, so a tag pushed on a branch
      # this history never merged is not picked up as "previous". A
      # rehearsal has no tag of its own, so it asks from HEAD directly
      # rather than HEAD^
      - name: Resolve the previous release
        id: previous
        env:
          REF: >-
            ${{ github.event_name == 'push' && format('{0}^', github.ref_name)
            || 'HEAD' }}
        run: |
          if tag=$(git describe --tags --abbrev=0 --match 'v*' "$REF" 2>&1); then
            echo "previous release: $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "has-previous=true" >> "$GITHUB_OUTPUT"
          else
            echo "no previous v* tag reachable from $REF: $tag"
            echo "has-previous=false" >> "$GITHUB_OUTPUT"
          fi
      # caching off, as in reusable-version-check.yml and for the same
      # reason: this job runs on the same tag-push and workflow_dispatch
      # triggers that job's own comment gives for downloading fresh
      # rather than trusting a cache entry written by a run this one
      # cannot vouch for
      - name: Setup uv
        if: steps.previous.outputs.has-previous == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # the notes are read by a script served from this repository the way
      # reusable-version-check.yml serves its own, `ref: main` being the
      # same trust the caller already extends by naming this workflow
      # `@main`. The script takes the standard library alone, which is
      # why the run below is --no-project
      - name: Check out the notes script
        if: steps.previous.outputs.has-previous == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: btclib-org/.github
          ref: main
          path: standard
          persist-credentials: false
          sparse-checkout: .github/scripts
      # griffe runs from PyPI through uvx rather than from a
      # pyproject.toml dependency group: unlike pre-commit -- pinned by
      # uv.lock because every contributor's own run has to agree with
      # the gate's -- this runs at release time only, on one
      # maintainer's own action, so a dependency group buys
      # reproducibility nothing here needs. The version pin on the line
      # below is what still keeps this comparison from answering
      # differently on two release days for a reason that has nothing
      # to do with either release.
      # The interpreter is named for the reason the griffe pin is:
      # uvx reads no .python-version, so an unnamed one is whatever uv
      # resolves that morning, which is the second way this comparison
      # could answer differently on two release days. Section 10 asks
      # it of a job reading no lock, the version is the one this
      # repository's own .python-version names, and
      # tests/interpreters_test.py reads the two against each other.
      # No base ref and no tag on a rehearsal: workflow_dispatch has no
      # tag to check a public surface at, so the comparison falls back to
      # griffe's own default, the current code, and the notes' section
      # for pyproject.toml's version, else the first. A rehearsal of a
      # release that breaks the public API runs from the release pull
      # request's branch after its notes are written, so that this
      # reads the release's own section: before, it reads another
      # release's, or a work-in-progress one. griffe prints its
      # findings on standard error, and oneline is the format that puts
      # the object and the file on one line for the script to read.
      # --quiet keeps uv's own progress lines out of that file, the
      # script refusing a line it cannot read. The exit code is 1 with
      # findings, so any other non-zero code is griffe failing rather
      # than finding
      - name: Check the public API against the previous release
        if: steps.previous.outputs.has-previous == 'true'
        env:
          PACKAGE: ${{ inputs.package }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          BASE_REF: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          base_args=()
          tag_args=()
          if [ -n "$BASE_REF" ]; then
            base_args=(-b "$BASE_REF")
            tag_args=(--tag "$BASE_REF")
          fi
          findings="$RUNNER_TEMP/griffe-findings.txt"
          status=0
          uvx --quiet --python 3.15 griffe==2.2.0 check "$PACKAGE" -s . -s src \
            -a "$PREVIOUS_TAG" "${base_args[@]}" -f oneline \
            > "$findings" 2>&1 || status=$?
          if [ "$status" -gt 1 ]; then
            cat "$findings"
            echo "::error::griffe exited $status"
            exit 1
          fi
          if [ "$status" -eq 1 ]; then
            echo "the public API changed since $PREVIOUS_TAG:"
            uv run --no-project --python 3.15 \
              standard/.github/scripts/check_public_api.py \
              "$PACKAGE" "$findings" RELEASE_NOTES.md "${tag_args[@]}"
          fi
      - name: Skip the check (no previous release to compare against)
        if: steps.previous.outputs.has-previous == 'false'
        run: |
          echo "::notice::no previous v* tag is reachable; nothing to" \
            "compare this release's public API against"
