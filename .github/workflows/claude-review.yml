---
name: claude-review

# Claude reading a pull request against REVIEWING.md, and answering a
# comment naming @claude. The checkout, the credential guard, the
# prompt, the review action, the verdict check and the mention are
# reusable-claude-review.yml's, which this file calls
# (btclib-org/.github#35).
# What stays here is the trigger, the concurrency group, the
# workflow-level permissions and the paragraph this tree adds to the
# prompt, none of which a called workflow holds.
#
# Here for a reason the other repositories do not have: README.md says
# the ack of record comes from this workflow, and a repository that
# states a rule and does not run it is the defect that file spends most
# of its length on. This is that rule applied to the file that states
# it.
#
# Not a required check, and it must not become one. What it produces is
# a review of type COMMENT, an opinion for the author to weigh; a review
# that gated a merge would make a model's judgement a branch rule.
#
# It is cheap: it reads a diff of prose and builds nothing.
#
# extra-allowed-tools is passed nothing rather than an empty string: a
# review of prose reaches for no tool beyond the ones every caller gets,
# and an explicit empty value would say something the absence does not.

on:
  pull_request:
    # ready_for_review so a pull request marked ready gets the review the
    # draft condition in reusable-claude-review.yml withheld while it was
    # a draft: the default types do not include it, and without it a
    # readied pull request would wait for its next push to be reviewed at
    # all. The same reasoning links.yml carries for the same type
    types: [opened, reopened, synchronize, ready_for_review]
  # the on-demand half: somebody writes @claude in a comment on a pull
  # request, or on a line of its diff, and asks for something the automatic
  # pass did not answer
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# least privilege for the GITHUB_TOKEN, elevated on the calling job below
# and nowhere else
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere else
# here. One key serves both halves of the workflow: a pull_request event
# keys on the pull request's number, so a push supersedes the review it
# overtakes, and every other event keys on github.run_id, which no two
# runs share, so an @claude answer neither cancels one nor is cancelled
# by one. The number alone would not do that, a
# pull_request_review_comment event carrying
# github.event.pull_request.number too and so landing a mention in the
# review's own group.
#
# At the workflow level rather than on the job, which is the placement
# btclib-org/btclib-secp256k1#593 settled: it is correct whether or not a
# job an `if` skips claims a job-level group, a question that issue
# closed without answering
concurrency:
  group: >-
    claude-review-${{ github.event_name == 'pull_request'
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # One calling job reaches both of the callee's jobs, and each of those
  # declines the events that are not its own, so this job carries no
  # `if:` of the review's: the switch, the draft check, the closed check
  # and the fork check are the callee's.
  #
  # By path, as links.yml calls reusable-links.yml, rather than the
  # `@main` a caller in another repository writes: the callee is this
  # tree's own file, so a path runs the copy at the commit under review,
  # where `@main` would review a branch that changes the callee with the
  # callee as `main` already holds it. zizmor's self-repository finding
  # is declined on the line, which is the form btclib-org/.github#1144
  # settled, this repository holding no zizmor.yml to state it in.
  #
  # Permissions are the calling job's: a called workflow's own block can
  # only downgrade what the caller granted, so a scope the callee's jobs
  # declare and this list omits is absent at run time, and
  # btclib-org/.github#912 is where a caller omitting one was measured to
  # end the run in `startup_failure` before a step ran.
  #
  # The secret is named rather than inherited: there is one to pass, and
  # `secrets: inherit` would hand the callee every secret this repository
  # holds, which is what zizmor's secrets-inherit audit flags
  claude-review:
    uses: ./.github/workflows/reusable-claude-review.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      # what posting the review or the reply takes
      pull-requests: write
      # not for workload identity federation, which this does not use:
      # the action mints a GitHub OIDC token during its own startup
      # whatever the Anthropic credential is
      id-token: write
    with:
      # what a review of this tree has to know that a review of any other
      # tree does not, landing between the verdict paragraph and the
      # gates instruction
      extra-prompt: |
        What this repository ships is mostly prose, so the
        findings differ in kind from a code review's. A rule that is
        stated without the reason that chose it, a claim no command
        re-derives, a count of anything, a second wording of a fact
        stated elsewhere, and a rule whose own repository does not
        keep it are the defects here -- README.md names each of
        them, and they are what to look for.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
