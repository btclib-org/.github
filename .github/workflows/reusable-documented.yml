---
name: reusable-documented

# The wait a repository's release.yml runs after a tag push, so that
# `github-release` and the publish jobs are not the last things a
# release does: a release is not finished until read the docs has
# rebuilt for the new tag, and this job is what blocks on that before
# the run reports done. The trigger stays in the caller, whose run this
# job joins; `if: github.event_name == 'push'` in the caller keeps it
# off a rehearsal, which has no tag for read the docs to build.
#
# One input, the read the docs slug. No default: the slug equals the
# repository name in every one of these trees today, but nothing forges
# that equality -- a project renamed on read the docs and not on the
# forge, or the other way round, would otherwise fail silently against a
# slug nothing here declares.
#
# The checkout is sparse, landing this repository's `.github/scripts`
# and its root alone, and the script it runs is served from here: a job
# inside a workflow hosted in btclib-org/.github checks out the calling
# repository's tree by default, `actions/checkout` reading
# `github.repository` from the run it is a step of rather than from
# where the workflow file lives, so `repository:` and `ref:` are what
# name this one instead. `main` is the same trust a caller already
# extends by naming this workflow `@main`. So this job builds nothing
# and installs nothing of the calling tree, and a caller owes no copy of
# wait_for_readthedocs_build.py.

on:
  workflow_call:
    inputs:
      readthedocs-slug:
        description: the project slug read the docs serves the calling tree under
        required: true
        type: string

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, the interpreter uv fetches) can read the token, so the
# workflow default must not be able to write to the repository. No job
# elevates it, this job polling a public URL and writing nothing back
permissions:
  contents: read

jobs:
  documented:
    # the name the check context is keyed by, after the calling job's
    # own: branch protection matches a context by name and not by the
    # workflow that reported it
    name: Check read the docs built the tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # sparse, for the reason given above: what lands is
      # .github/scripts plus this repository's root, cone mode being the
      # default and root files always being in the cone. This job builds
      # nothing and installs nothing, and the root's pyproject.toml is
      # inert besides, --no-project ignoring it
      - name: Check out the wait script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: btclib-org/.github
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      # caching off, as in reusable-version-check.yml and for the same
      # reason: this is a job of the workflow whose other jobs hold an
      # OIDC token PyPI accepts, so no job of it reads a cache entry a
      # run it cannot vouch for wrote. There is little to cache here in
      # any case, the step below installing nothing
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      # --no-project, so it runs on the interpreter uv fetches and
      # installs nothing: the script takes the standard library alone.
      # The version is named rather than left to uv: the sparse
      # checkout above lands this repository's own .python-version with
      # the rest of the root, and uv run --no-project reads it, so an
      # unnamed interpreter here would be whatever that file happens to
      # say rather than what this job asks for. Section 10 is the rule,
      # the version is the one that file names, and
      # tests/interpreters_test.py reads the two against each other
      - name: Wait for the tag's documentation to be served
        env:
          TAG: ${{ github.ref_name }}
          SLUG: ${{ inputs.readthedocs-slug }}
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/wait_for_readthedocs_build.py "$SLUG" "$TAG"
