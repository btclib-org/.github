---
name: alignment

# The half of section 15's audit a machine can run: every repository
# asked whether it still agrees with README.md, and the questions whose
# answer is not in any one tree. A repository can test what it says
# about itself -- interpreters_test.py, conventions_test.py, the hook
# pins -- and none of them can test that it agrees with a file it holds
# no copy of, or that the repositories agree with each other.
#
# What it asks is in tests/, each module's docstring naming the section
# it reads. Restating the list here would be a second copy to keep in
# step with the first, and the copy nobody running the suite reads.
#
# A sentinel and not a gate, for the reason every network check in this
# organization is one: an API that is down is nothing a pull request
# introduced, and what this reports is drift that happened elsewhere,
# days ago, in a repository nobody is currently working in. It gates
# nothing, so a red run here is a backlog rather than a block.
#
# It runs on a pull request that touches the suite itself, which is how a
# change to a question gets asked before it is merged, and reads this
# working tree for `.github` rather than cloning it -- so a pull request
# that edits the calendar is checked against the calendar it proposes.
#
# The token is ALIGNMENT_TOKEN, a fine-grained token over the
# organization's repositories, read-only. The settings half of the
# questions is what needs it: a repository's classic protection and its
# Actions permissions are refused to a token that reads the tree alone.
# What stays unasked even with it is what the endpoint answers by
# omission -- the merge-method fields, and a ruleset rule's
# bypass_actors -- both left out for a token without push access, and
# the tests that ask those skip with the reason rather than passing.
#
# There is no fallback to GITHUB_TOKEN, and that absence is the point.
# GITHUB_TOKEN is this repository's own, so it answers for none of the
# others, and the permissions block below leaves it reading this tree:
# the Actions-permissions endpoint refuses that in this repository too. A
# fallback puts the failure inside the suite, where the Actions tab
# shows what a run that found real drift shows and the log is what
# tells the two apart. The step below refuses before the checkout
# instead, in one message naming the secret.

on:
  schedule:
    # The time is section 10's grid and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "24 5 * * 6"
  workflow_dispatch:
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed joins them so that a run still held in this pull request's
    # own concurrency group is superseded by it -- cancel-in-progress
    # fires only when a new run lands in that group, and nothing
    # otherwise does
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      # every workflow of this tree and not this one alone: the suite
      # reads the `cron:` of each of them, so a schedule edited here is
      # a change to what it is being asked about
      - .github/workflows/**
      - tests/**
      - pyproject.toml
      - uv.lock
      # the two sections the suite reads as data: a row added to the
      # calendar, or a file added to the verbatim list, is checked by
      # the run on the commit that adds it. Naming this tree's product
      # selects nearly every branch here, which section 10 settles on
      # the clock rather than on the count: what this sweep adds to the
      # wait a pull request already has is seconds, so a list narrow
      # enough to spare a prose branch would buy that branch seconds
      # and leave the drift it introduces to wait for Saturday
      - README.md
      # section 14's verbatim files themselves, so a pull request that
      # edits one is checked against the copies it would leave behind
      # rather than waiting for the Saturday cron --
      # tests/verbatim_test.py::test_alignment_triggers_on_every_verbatim_file
      # is what keeps this list and section 14's in step
      - .markdownlint.jsonc
      - .yamllint.yaml
      - .taplo.toml
      - COPYRIGHT
      - LICENSE
      - .claude/commands/review.md
      - CONTRIBUTING.md
      - REVIEWING.md
      - .gitattributes

# least privilege: this reads the organization's repositories and writes
# nothing, files nothing and publishes nothing
permissions:
  contents: read

concurrency:
  # github.event.pull_request.number, not github.ref alone: for a closed,
  # merged pull request github.ref resolves to the base branch's ref,
  # which the schedule and a dispatch also resolve to, so grouping by it
  # alone would let a closed pull request cancel a scheduled run
  group: alignment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  alignment:
    name: Check the organization against README.md
    # a draft pull request is work in progress and spends no runner here.
    # A closed one spends none either -- the trigger above takes the
    # closed event only to supersede a run still holding in this group
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # a run without the token measures nothing, and the red it leaves
      # is the one this sweep reports drift with. So the absence is
      # answered here, before the checkout, in a message naming the
      # secret, rather than as an error inside the suite on whichever
      # question reaches the API first
      - name: Refuse to sweep without the token
        env:
          ALIGNMENT_TOKEN: ${{ secrets.ALIGNMENT_TOKEN }}
        run: |
          if [ -z "$ALIGNMENT_TOKEN" ]; then
            echo "::error::ALIGNMENT_TOKEN is empty. It is a fine-grained" \
                 "token over btclib-org, read-only, and this run measured" \
                 "nothing without it: the failure is the secret, not a" \
                 "finding about the organization."
            exit 1
          fi

      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes, and a token left in the checkout's git
          # config is one every later step can read
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # BTCLIB_INTEGRATION is what the suite skips itself without, this
      # being the one suite in the organization that reaches the network
      # on purpose. --locked so a stale lock fails here rather than
      # resolving something nobody chose
      - name: Check what no single repository can
        env:
          BTCLIB_INTEGRATION: "1"
          # ALIGNMENT_TOKEN and nothing else: the step above has
          # already refused the run this has no token for, and a
          # fallback is what makes a wrong-scope failure of a missing
          # secret
          GH_TOKEN: ${{ secrets.ALIGNMENT_TOKEN }}
        run: uv run --locked --no-default-groups --group test pytest
