---
name: reusable-build

# The build a release publishes, and the signature on what it built.
# SLSA Build L3 asks that the signing workflow be a reusable workflow
# the tree's own steps cannot alter, so the build and the attestation
# are written here and a tree's release.yml calls this file.
#
# The signature is made before the environment approval, at build
# time, and not after the publish as reusable-attest.yml does: PyPI
# does not accept a reusable workflow as a Trusted Publisher, so the
# publish jobs stay in the tree, and they download what this run
# built and attested.
#
# Two jobs, so that the one that runs the build holds no OIDC token:
# `build` has `contents: read` and prints the digests of what it wrote;
# `attest` downloads the artifacts, refuses any file whose digest is not
# the one `build` printed, and signs. A tree's `test.yml` keeps the
# checks, the smoke tests and the sdist suite, and reads the `dist`
# artifact on a release.
#
# The signer a verifier names is this file at `main`:
#
#     gh attestation verify <file> --repo <owner>/<tree> \
#       --signer-workflow btclib-org/.github/.github/workflows/reusable-build.yml@refs/heads/main \
#       --source-ref refs/tags/v<version>
#
# `--source-ref` is what keeps a rehearsal dispatched from a branch from
# verifying as a release.
#
# The checkout is the calling tree's: its `.github/scripts/normalize_sdist.py`
# and its `.github/actions/dev-version` run here, and the script that
# writes the bill of materials is this repository's, from `main`.
#
# A tree's calling job carries `permissions: contents: read,
# id-token: write, attestations: write`, a called workflow's own block
# being able to lower what the caller granted and never to raise it
# (README.md, section 11).
#
# Artifacts, named as test.yml's and reusable-github-release.yml's are:
# `dist` (the sdist and the wheel), `sbom` and `attestation`.
#
# `python` has no default: the interpreter that gzips the sdist decides
# its digest, which makes it a claim of the calling tree.

on:
  workflow_call:
    inputs:
      python:
        description: >
          The interpreter the sdist normalizer and the bill of
          materials run on, as `3.15`.
        required: true
        type: string
      version-suffix:
        description: >
          Appended to the version in pyproject.toml before the build,
          by the tree's dev-version action. A release passes nothing; a
          rehearsal passes a `.dev` suffix.
        type: string
        default: ""

# least privilege for the GITHUB_TOKEN at the workflow level, elevated
# on the job below -- each grant explained at its own line there
permissions:
  contents: read

jobs:
  build:
    name: Build the distribution files and the bill of materials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # restated, a job's permissions replacing the workflow's
      contents: read
    outputs:
      # `sha256sum` over every file the artifacts hold, sorted by path
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      # every action is pinned to a commit SHA, the tag in the comment:
      # a tag is a name its owner can move, and these run in a job that
      # can read the workflow token
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # no cache: a cache entry another run wrote must not reach a
      # build that is signed
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # what the normalizer and the bill of materials read: the commit's
      # own second, which uv_build ignores and hatchling honours
      - name: Pin the build timestamp to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Make the version unique for TestPyPI (rehearsal only)
        if: inputs.version-suffix != ''
        uses: ./.github/actions/dev-version # zizmor: ignore[self-repository]
        with:
          suffix: ${{ inputs.version-suffix }}
      # the sdist first and then the wheel from it
      - name: Build the distribution files
        run: uv build
      # rewrites the member metadata, so the digest the attestation
      # signs is the pipeline's output. --no-project: installs nothing
      # into the tree it is about to publish
      - name: Rewrite the sdist's member metadata
        env:
          PYTHON: ${{ inputs.python }}
        run: uv run --no-project --python "$PYTHON" .github/scripts/normalize_sdist.py dist/
      - name: Check out the script that writes the bill of materials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: btclib-org/.github
          ref: main
          path: btclib-org-github
          persist-credentials: false
          sparse-checkout: .github/scripts
      # into a directory of its own, dist/ being what an index takes
      - name: Write the bill of materials
        env:
          PYTHON: ${{ inputs.python }}
        run: >-
          uv run --no-project --python "$PYTHON"
          btclib-org-github/.github/scripts/generate_sbom.py dist/ sbom/
      # the attest job's reference: what it signs is what these hashes
      # name, whatever happens to the artifacts between the two jobs
      - name: Record the digests
        id: digests
        run: |
          {
            echo "digests<<DIGESTS_END"
            sha256sum dist/* sbom/* | LC_ALL=C sort -k2
            echo "DIGESTS_END"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Upload the distribution files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - name: Upload the bill of materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/

  attest:
    name: Attest the release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents is not restated: this job reads nothing of the tree
      id-token: write # the short-lived Sigstore signing certificate
      attestations: write # persisting the attestation against the repository
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Download the bill of materials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
      # the two lists are equal or nothing is signed: a file changed,
      # added or missing since the build job printed its digests fails
      # here
      - name: Check the files against the build job's digests
        env:
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          printf '%s\n' "$DIGESTS" > "$RUNNER_TEMP/digests.txt"
          sha256sum dist/* sbom/* | LC_ALL=C sort -k2 | diff - "$RUNNER_TEMP/digests.txt"
      # actions/attest and not the attest-build-provenance wrapper around
      # it. One statement over every subject, so the wheel, the sdist or
      # the bill of materials verifies against the bundle
      - name: Attest the release assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            sbom/*
      # the bundle reusable-github-release.yml attaches, for whoever
      # verifies from disk rather than from the attestations API
      - name: Collect the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" attestation.jsonl
      - name: Upload the attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation
          path: attestation.jsonl
