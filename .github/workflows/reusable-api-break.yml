---
name: reusable-api-break

# The advisory a tree's pull request runs beside reusable-public-api.yml:
# the same griffe walk, against the pull request's base commit instead
# of the last release, and its answer a label, `api-break`, instead of a
# check. btclib-org/.github#1674 decided that the label informs a
# review and gates nothing, so a break the notes would have to name is
# seen while the pull request can still change.
#
# It reaches the release's reasoning from the other side
# (btclib-org/.github#326): before 1.0 the public surface breaks
# deliberately and often, so a check that failed on every such break
# would have nothing to say about which ones are allowed. A label says
# only that there is one. The release job is where a break is refused
# unless the notes name it.
#
# Advisory in three ways. The job concludes green whatever griffe or the
# label calls answer, a failure to compare being a warning in the log.
# It joins no aggregate and is no required check. And a label is only
# ever added or removed, never another's, so a later push that breaks
# nothing clears it.
#
# Only a pull request from the calling repository is labelled. A fork's
# pull request runs with a read-only token, and the two ways round that,
# pull_request_target and workflow_run, hand a write token to a trigger
# the organization declines (bestpractices/<tree>.json, OSPS-BR-01.01).
# A fork's run still does the comparison and writes its finding to the
# job summary, so the reviewer reads it there and the label is left to a
# maintainer to apply by hand.
#
# One input, the package griffe walks, with no default, for the reason
# reusable-public-api.yml gives. The trigger, its types and the
# concurrency group stay in the caller, section 10 having them literal.

on:
  workflow_call:
    inputs:
      package:
        description: the griffe target, e.g. "btclib" or "btclib_node"
        required: true
        type: string

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, griffe itself) can read the token, so the
# workflow default must not be able to write. The one job below elevates
# it for the label alone
permissions:
  contents: read

jobs:
  api-break:
    # the name the check context is keyed by, after the calling job's
    # own, and not a required check
    name: Label a pull request that breaks the public API
    # a draft is work its author is not asking anyone to read yet, and a
    # closed pull request has stopped taking changes the label would be
    # about
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # advisory: a step that fails for a reason of the runner's, such as
    # an action that cannot be fetched, must not turn the pull request red
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # the label; read-only on a fork
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the base commit has to be reachable for griffe to walk it
          fetch-depth: 0
      # caching off, for the reason reusable-public-api.yml gives
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # griffe's version and interpreter are named for the reason
      # reusable-public-api.yml gives, and are the same there. The exit
      # code is 1 with findings and any other non-zero code is griffe
      # failing to compare, as when the package does not exist at the
      # base yet: then nothing is said about the label either way
      - name: Compare the public API with the base
        id: compare
        env:
          PACKAGE: ${{ inputs.package }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          findings="$RUNNER_TEMP/griffe-findings.txt"
          status=0
          uvx --quiet --python 3.15 griffe==2.2.0 check "$PACKAGE" -s . -s src \
            -a "$BASE_SHA" -f oneline > "$findings" 2>&1 || status=$?
          echo "findings=$findings" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then
            cat "$findings"
            echo "::warning::griffe exited $status; the label stays as it is"
            echo "broken=unknown" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 1 ]; then
            echo "broken=true" >> "$GITHUB_OUTPUT"
          else
            echo "broken=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report the finding
        if: steps.compare.outputs.broken == 'true'
        env:
          FINDINGS: ${{ steps.compare.outputs.findings }}
        run: |
          {
            echo "### The public API changes against the base"
            echo
            echo '```text'
            cat "$FINDINGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # a label that is already as it should be is left alone, and a
      # failed call is a warning: the label is an advice
      - name: Set the label
        if: >-
          steps.compare.outputs.broken != 'unknown'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BROKEN: ${{ steps.compare.outputs.broken }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          issue="repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST}"
          if [ "$BROKEN" = true ]; then
            gh api --method POST "$issue/labels" -f 'labels[]=api-break' \
              > /dev/null || echo "::warning::could not add api-break"
          else
            gh api --method DELETE "$issue/labels/api-break" \
              > /dev/null 2>&1 || echo "api-break was not on the pull request"
          fi
