---
name: lint

# The pre-commit hooks are what this workflow runs from
# .pre-commit-config.yaml itself, never a second list of the same tools:
# a commit and CI then enforce one thing, and a hook added to that file
# needs no edit here.
#
# Here because README.md section 4 states that rule and this repository
# was the one not keeping it: the hook config and the markdownlint,
# yamllint, taplo and typos configuration it reads were all in the tree
# with nothing on the forge running any of them, so the gate was a
# suggestion an author could forget. The `ci:` block names pre-commit.ci
# as a runner, and pre-commit.ci reports rather than blocks -- what makes
# a hook a gate is this job's name in the branch rule.
#
# The job also runs the suite with `BTCLIB_INTEGRATION` unset, which is
# not a second copy of `alignment.yml`'s question: what runs here is
# only the tests that carry no `integration` marker, `.github/scripts/`'s
# own among them, and none of those reaches the network.
# btclib-org/.github#1367 is what settled it: `alignment.yml` is not a
# required check, so this is what puts those tests in a job every
# merge already waits on.

on:
  push:
    branches: [main]
  pull_request:
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # pull request's own concurrency group is still holding survives
    # either unless the closed event lands in that same group -- which
    # this type is what makes it do, cancel-in-progress below turning the
    # landing into the cancellation
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the gates included: a branch whose pull request is not open yet has
  # no other way to ask
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN. Nothing here writes anything --
# the hooks that fix in place fix a checkout that is thrown away, the
# `ci:` block refusing an autofix commit for the same reason -- so no job
# elevates it
permissions:
  contents: read

concurrency:
  # named literally, never through github.workflow: in a called workflow
  # that expression is the *caller's* name, so two workflows called from
  # one place would share a group and cancel each other.
  #
  # Keyed on the pull request's number, which is what section 10 of
  # README.md asks and what btclib-org/btclib#1158 settled. Not because
  # head_ref would collide with the push trigger's group -- it would
  # not: head_ref is read from the event payload, so it is there on a
  # closed pull request too, where github.ref has already resolved to
  # the base branch. What the number survives and head_ref does not is
  # two pull requests whose head branches carry the same name, two forks
  # each pushing "patch-1", which share one head_ref group and cancel
  # each other.
  #
  # A run with no pull request -- a push to main, a dispatch -- has no
  # number and falls back to github.ref, which is what gives it a group
  # of its own
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # this job is a required check, so this name is its context, a context
    # being keyed by name alone.
    # Not the sibling repositories' "Lint and type-check", though the
    # config it runs carries a mypy hook as theirs do: the name is bound
    # outside the repository, so changing it cannot be done in a pull
    # request -- the branch stops producing the old name while the rule
    # still waits for it -- and a name narrower than the job is what that
    # costs. The direction README.md is written against is the other one,
    # a check naming a step that does not run
    name: Lint
    # a draft pull request is work its author is not asking anyone to
    # read yet and spends no runner. A closed one spends none either --
    # the trigger above takes the closed event only to supersede a run
    # this pull request's own group is still holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # a cold cache builds a node, a rust and a python environment before
    # a hook runs at all; a job past this is hung rather than working
    timeout-minutes: 20
    steps:
      # every action pinned to a commit SHA with the tag in the comment:
      # a tag, let alone a branch, is a name its owner can move
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the hooks read the tree and nothing pushes it back
          persist-credentials: false

      # check-changelog compares CHANGELOG.md with the merge base of HEAD
      # and origin/main, and a shallow checkout holds neither the parents
      # of HEAD nor origin/main. One more level of HEAD and main's tip give
      # the merge base on a push and on a pull request while main is at
      # most one commit past the event; past that there is none, and the
      # hook says it compared nothing. A full checkout fetches main whole
      # instead: a shallow fetch would make it shallow
      - name: Fetch the base check-changelog compares against
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --deepen=1 origin "$(git rev-parse HEAD)" \
              +refs/heads/main:refs/remotes/origin/main
          else
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi

      # uv is the only prerequisite here as everywhere, and this is the
      # step that supplies it. No cache asked of it, where alignment.yml
      # asks for one: what uv resolves in this job is the lint and test
      # groups, the mypy hook's own `uv run` already asking for both, and
      # whether that is worth a cache is a question for a measured job
      # time rather than for this comment. The environments that cost the
      # minutes today are cached below
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # the cache key needs the runner image, not only the OS: a
      # pre-commit environment built on one image is not always usable on
      # the next one, and a stale hit fails in the hook rather than here
      - name: Identify the runner image
        id: image
        run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # the interpreter beside the hook config: a `language: python`
          # hook's environment is built against the Python `uv run`
          # resolves below, the one `.python-version` names, and is
          # cached under a name carrying that version, so a key naming
          # the config alone stands for the environments of two
          # interpreters at once and restores ones pre-commit rebuilds
          # rather than runs
          key: >-
            pre-commit-${{ runner.os }}-${{ steps.image.outputs.os }}-${{
            hashFiles('.pre-commit-config.yaml', '.python-version') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ steps.image.outputs.os }}-

      # uv run --locked --only-group lint, the sibling repositories'
      # form, and the one CONTRIBUTING.md's last section now gives an
      # author to run before pushing: pre-commit comes out of the lint
      # group pinned by uv.lock rather than out of uvx, which fetches
      # whatever the index holds that morning, and running the same
      # command is the point -- a workflow invoking pre-commit some
      # other way is the second declaration section 4 refuses, one
      # version behind the author's or ahead of it. btclib-org/.github#1375
      # is what settled it: nothing ran the pinned copy `uv.lock` and the
      # lint group carried.
      # --only-group omits the project, so this step installs nothing a
      # hook does not ask for itself; the mypy hook is a `language:
      # system` entry whose own `uv run` installs what it type checks
      # against, and resolves the interpreter .python-version names
      # itself where the runner lacks it.
      # --show-diff-on-failure changes no hook's answer: it prints what
      # an in-place fixer changed, so a red job says what to apply rather
      # than only that something is unclean
      - name: Run every hook
        run: >
          uv run --locked --only-group lint
          pre-commit run --all-files --show-diff-on-failure

      # BTCLIB_INTEGRATION is deliberately unset: what this runs is only
      # the tests carrying no `integration` marker, conftest.py skipping
      # the rest at collection -- `.github/scripts/`'s own tests among
      # them, none of which reaches the network. This is not a narrower
      # rehearsal of `alignment.yml`'s question, it is the whole of a
      # different, network-free one.
      - name: Run the offline tests
        run: uv run --locked --no-default-groups --group test pytest

  dependency-review:
    # btclib-org/.github's reusable-lint.yml job, written out because this
    # file keeps its own lint job; section 11 of btclib-org/.github's
    # README.md states the rule. A job of its own rather than a step of the
    # one above: it reads the forge's dependency graph and not the checkout,
    # so it takes no checkout and no hook environment. It is a required
    # check, and its context is this name.
    name: Dependency review
    # the action compares a pull request's base and head, which only a
    # pull_request event carries: on a push or a dispatch it has no pair
    # and fails. A draft and a closed pull request decline as the job
    # above does
    if: >-
      ${{ github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # the action makes a few API calls and installs nothing, so a job past
    # this is waiting on the forge
    timeout-minutes: 10
    # the compare endpoint needs contents: read, and the action posts
    # nothing
    permissions:
      contents: read
    steps:
      # no checkout: the action reads the graph through the API and the
      # config file through the input below
      - name: Review the dependencies this pull request changes
        # pinned to a commit SHA, the tag in the comment
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # the organization's one file, at main, so that a change to the
          # threshold reaches every tree in one landing
          config-file: btclib-org/.github/.github/dependency-review.yml@main
          # a remote config file is read without credentials unless this
          # carries one, and GitHub limits an unauthenticated request by
          # the address it comes from, which a runner shares
          external-repo-token: ${{ github.token }}

  sign-off:
    # btclib-org/.github's reusable-lint.yml job, written out because this
    # file keeps its own lint job, and running the script from this checkout
    # rather than from main: a branch changing the script is checked by its
    # own copy. Its context is this name
    name: Sign-off
    # the commits read are those between a pull request's merge commit's two
    # parents, and only a pull_request event checks that commit out. A draft
    # and a closed pull request decline as the jobs above do
    if: >-
      ${{ github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # git reads a few commits and uv fetches one interpreter, so a job past
    # this is hung
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # the whole history: a branch's commits go back to where it left the
      # base, however far that is
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # --no-project, so the script installs nothing, on the interpreter this
      # tree's .python-version names. HEAD is the merge commit: its first
      # parent is the base, its second the head
      - name: Check that every commit is signed off by its author
        run: uv run --no-project .github/scripts/check_sign_off.py HEAD^1..HEAD^2
