---
# the lint gate of the repository that carries the organization
# standard. Mostly the markdown half of it, this tree being mostly prose;
# the Python half applies to tests/, which is the standard asking the
# organization the questions no single repository can ask itself.
#
# Skip a hook with SKIP=<id>, or all of them with "git commit -n".
ci:
  # a bot committing to a branch is at odds with a setup where no
  # workflow token can write: a failing hook is fixed by its author
  autofix_prs: false
  autoupdate_commit_msg: "Update the pinned pre-commit hook revisions"
  autoupdate_schedule: weekly
  # the one hook pre-commit.ci cannot run: it shells out to uv, which is
  # not installed there. What the skip costs is nothing that decides a
  # merge -- lint.yml runs this file whole, with the command a developer
  # runs, on every commit and every pull request
  skip: [mypy]

repos:
  # this file checking itself, and the only two hooks with no environment
  # to install: a pattern that has stopped matching is a rule that has
  # quietly stopped running
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  # and checking the two moves "autoupdate" must not make: a rev naming
  # only a major follows every future release of it, and a prerelease is
  # not a release. pre-commit says the first half itself, on stderr, on a
  # run that then exits zero -- which is the difference between a warning
  # and a gate. A commit SHA stays acceptable: forty hex characters do not
  # end in a prerelease marker
  - repo: local
    hooks:
      - id: pinned-rev
        name: every pre-commit rev names a released version
        language: pygrep
        entry: '^ *rev: "?v?([0-9]+|[0-9][0-9.]*(a|b|rc|dev)[0-9]+)"?$'
        files: ^\.pre-commit-config\.yaml$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: check-yaml
      # the toml here is read by taplo every run, but a format is not a
      # parse: what taplo cannot read fails its own hook, and what it can
      # read it rewrites and passes -- a key or a table declared twice
      # among it, which parses as grammar and is not a TOML document.
      # Section 4 puts that question in the gate
      - id: check-toml
      # at its default, *_test.py, which is section 7's spelling: what
      # the hook adds is the refusal of a module under tests/ named any
      # other way, a test pytest never collects or shared code in a file
      # of its own. This tree's shared helpers are in tests/__init__.py,
      # which is where section 7 puts shared test code and one of the
      # two basenames the hook passes over
      - id: name-tests-test
      - id: check-added-large-files
      # there are none, and a submodule is the one dependency that would
      # be pinned by nothing here
      - id: forbid-submodules
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  # a release tag, not the `v1` beside it: that one is a major-version
  # alias upstream moves onto each release, so `pre-commit autoupdate`
  # picks it as the newest tag and the pin stops being one
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
  # MD013 at 80 columns, tables included, and the shared configuration is
  # the one every repository of the organization carries: prose moves
  # between them, and a paragraph that lints in one has to lint here
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  # how a link destination is spelled, which markdownlint has no rule
  # for. Section 4 of README.md is the rule, why the prefix and not the
  # extension, why a badge needed the link text to step over an image,
  # and what this cannot see; there is no shared hook repository to write
  # it in once, so it is the same hook in each repository, `pinned-rev`
  # above being that arrangement already
  - repo: local
    hooks:
      - id: local-link-prefix
        name: a local markdown link destination begins with ./
        language: pygrep
        # one line, and no literal space in it -- "\x20" is the space the
        # reference branch allows -- so yamllint reads the value as a
        # single unbreakable word and its 100-column rule exempts it. A
        # block scalar rather than a quoted one for the same reason a
        # folded scalar was rejected: folding joins lines with a space,
        # which would land inside the regex
        entry: |-
          (?<![`!\[])(?:!?\[(?:[^]]|\]\([^)]*\))*\]\(|^\x20{0,3}\[[^]]+\]:\s*)(?!\./|#|[A-Za-z][A-Za-z0-9+.-]*:)[^)\s]
        types: [markdown]
      # a line that ends inside a word, at that word's own hyphen.
      # Section 4 of README.md is the rule: what such a line renders as,
      # why nothing else here catches it, what this pattern cannot see,
      # and what the measurement was before it was proposed
      - id: no-hyphen-at-end-of-line
        name: a word is not wrapped at its own hyphen
        language: pygrep
        entry: "[A-Za-z0-9]-$"
        types: [markdown]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: prettier (yaml and jsonc, in place fixes)
        # named by path rather than by type: `jsonc` is not a tag identify
        # knows, so a types_or entry for it fails the config outright
        files: ^(.*\.ya?ml|\.markdownlint\.jsonc)$
  # the toml here is configuration and nothing else: .taplo.toml, which
  # carries the formatting choices and the reasoning, and pyproject.toml.
  # One indent for every toml in the organization is the point of having
  # a formatter at all. Naming them here is what .taplo.toml asks of the
  # repository that carries it, that file being shared and so unable to
  # say which toml any one tree holds; git ls-files '*.toml' is what says
  # whether this comment has gone stale
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        name: taplo (toml, in place fixes)
  # the width of a toml comment, which taplo above does not settle: it
  # aligns a comment that trails a value and rewraps none. Section 3 names
  # this hook as what holds pyproject.toml's comments to 80 columns, a
  # width a tree can be at by hand with nothing saying so. A trailing
  # unbreakable link is exempt, the
  # pattern asking for whitespace after the eightieth column
  - repo: local
    hooks:
      - id: toml-comment-width
        name: toml comment width (80 columns, unbreakable links exempt)
        language: pygrep
        entry: '^(?=[ \t]*#).{80}\S*[ \t]'
        files: \.toml$
      # a decoded child process names its encoding. text=True decodes
      # with the locale's, which is the defect ruff's unspecified-encoding
      # catches one layer in and no linter here has an opinion on at this
      # keyword. What this suite runs is git and gh, and every call here
      # that decodes an answer passes encoding="utf-8" already; the hook
      # is what refuses the first that does not
      - id: decoded-subprocess-encoding
        name: a decoded subprocess names its encoding, not text=True
        language: pygrep
        entry: '\b(text|universal_newlines)=True'
        files: \.py$
  # .github/dependabot.yml is validated by nothing else here: check-yaml
  # above asks whether it is yaml and nothing reads it as what it is. A
  # typo in a package-ecosystem or a directory is not an error to GitHub
  # -- it silently updates nothing, and the evidence is a pull request
  # that never arrives, which is the one failure a file whose job is to
  # open them must not have. Section 4's schemas bullet; check-readthedocs
  # is not beside it, there being no .readthedocs.yaml to read
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-dependabot
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        name: ruff check (in place fixes)
        args: [--fix]
      - id: ruff-format
        name: ruff format (in place fixes)
  # the project's own environment rather than the mirror's isolated one:
  # what this suite's types rest on is pytest, PyYAML and
  # trove-classifiers, all three already resolved in uv.lock, where the
  # mirror would need each named again in additional_dependencies and
  # kept equal to the lock by nothing. Section 4 has the trade in full;
  # the price taken here is the `skip:` above
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, in the project environment)
        entry: >
          uv run --locked --no-default-groups --group lint --group test
          mypy tests
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      # keep uv.lock in sync with pyproject.toml
      - id: uv-lock
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
